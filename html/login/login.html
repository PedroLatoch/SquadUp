<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="../../css/registro.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <img src="img/logo.png" alt="Logo" class="auth-logo">

        <h1 class="auth-title">SquadUp Login</h1>

        <label for="username" class="auth-label">Usuário</label>
        <input
            type="text"
            id="username"
            class="auth-input"
            placeholder="Username"
        >

        <label for="password" class="auth-label">Senha</label>
        <input
            type="password"
            id="password"
            class="auth-input"
            placeholder="Password"
        >

        <button id="login_button" class="auth-button">
            Login
        </button>

        <p class="auth-text">
            Não possui cadastro?
            <a href="./registro/registro.html">Registrar</a>
        </p>

    </div>

<div id="modal_senha_invalida"></div>

    <script src="../../js/registro/info_usuarios.js"></script>

</body>
</html>
