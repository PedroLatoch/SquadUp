<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../../../css/registro.css">
</head>
<body class="auth-page">
    <div class="auth-card"> 
        <h1 class="auth-title">vamos começar o seu registro</h1>       
        <label for="username" class="auth-label">usuario</label>
        <input type="text" id="username" class="auth-input" placeholder="Username">
        <label for="email" class="auth-label">e-mail</label>
        <input type="email" id="email" class="auth-input" placeholder="Email">
        <label for="password" class="auth-label">senha</label>
        <input type="password" id="password" class="auth-input" placeholder="Password">
        <label for="confirm-password" class="auth-label">confirmar senha</label>
        <input type="password" id="confirm-password" class="auth-input" placeholder="Confirm Password">
      
        <button id="register-button" class="auth-button">Registrar</button>
        <p class="auth-text">ja possui cadastro? <a href="../login.html">Login</a></p> 
     </div>
   
    <div id="modal_sem_usuario"     ></div>
</body>
<script src="../../../js/registro/info_usuarios.js"></script>
</html>
